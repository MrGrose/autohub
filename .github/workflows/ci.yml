name: CI

on:
  push:
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: autohub
          POSTGRES_PASSWORD: autohub
          POSTGRES_DB: autohub
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U autohub -d autohub"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      APP_ENV: test
      DATABASE_URL: postgresql+psycopg2://autohub:autohub@127.0.0.1:5432/autohub
      SECRET_KEY: test-secret-key-for-ci-only-32-chars
      ADMIN_USERNAME: admin
      ADMIN_PASSWORD: test-password-123
      MEDIA_ROOT: uploads-test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements*.txt
      - name: Install dependencies
        run: pip install -r requirements.txt -r requirements-dev.txt
      - name: Lint
        run: ruff check app tests
      - name: Test
        run: pytest -q

  website:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: website
    env:
      CARS_API_URL: http://127.0.0.1:8000
      NEXT_PUBLIC_SITE_URL: https://example.com
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: website/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Build
        run: npm run build
