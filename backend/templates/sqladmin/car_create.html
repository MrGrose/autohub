{% extends "sqladmin/layout.html" %}
{% block content %}
<link rel="stylesheet" href="/static/admin-car.css" />
<div class="col-12">
  <div class="card">
    <div class="card-header d-flex align-items-center gap-3">
      <a href="{{ url_for('admin:list', identity=model_view.identity) }}" class="btn btn-primary px-4">
        К списку
      </a>
      <h3 class="card-title mb-0">Добавить {{ model_view.name }}</h3>
    </div>
    <div class="card-body border-bottom py-4 px-4">
      <form action="{{ url_for('admin:create', identity=model_view.identity) }}" method="POST"
        enctype="multipart/form-data">
        {% if error %}
        <div class="alert alert-danger mb-4" role="alert">{{ error }}</div>
        {% endif %}

        <fieldset class="form-fieldset car-admin-form border-0 m-0">
          {% include "sqladmin/_car_form_fields.html" %}
        </fieldset>

        <div class="car-admin-photos mt-4 pt-4 border-top">
          <label class="form-label" for="photo_files">Фото</label>
          <input type="file" id="photo_files" name="photo_files" class="form-control" multiple
            accept="image/jpeg,image/png,image/webp" />
          <small class="text-muted d-block mt-2">
            Сначала сохраните запись, затем можно добавить фото при редактировании (если создаёте без фото).
          </small>
        </div>

        <div class="d-flex flex-wrap gap-2 mt-4 pt-2">
          <button type="submit" name="save" value="Save and continue editing" class="btn btn-primary px-4">
            Сохранить
          </button>
          <button type="submit" name="save" value="Save" class="btn btn-outline-secondary px-4">
            Сохранить и к списку
          </button>
        </div>
      </form>
    </div>
  </div>
</div>
{% endblock %}
