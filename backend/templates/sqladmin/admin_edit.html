{% extends "sqladmin/layout.html" %}
{% block content %}
<link rel="stylesheet" href="/static/admin-car.css" />
<div class="col-12">
  <div class="card">
    <div class="card-header d-flex align-items-center gap-3">
      <a href="{{ url_for('admin:list', identity=model_view.identity) }}" class="btn btn-primary px-4">
        К списку
      </a>
      <h3 class="card-title mb-0">Редактировать {{ model_view.name }}</h3>
    </div>
    <div class="card-body border-bottom py-4 px-4">
      <form action="{{ model_view._build_url_for('admin:edit', request, obj) }}" method="POST"
        enctype="multipart/form-data">
        {% if error %}
        <div class="alert alert-danger mb-4" role="alert">{{ error }}</div>
        {% endif %}

        <fieldset class="form-fieldset car-admin-form border-0 m-0">
          {% include "sqladmin/_admin_form_fields.html" %}
        </fieldset>

        <div class="d-flex flex-wrap gap-2 mt-4 pt-2">
          <button type="submit" name="save" value="Save and continue editing" class="btn btn-primary px-4">
            Сохранить
          </button>
        </div>
      </form>
    </div>
  </div>
</div>
{% endblock %}
