{% extends "sqladmin/base.html" %}
{% block body %}
<div class="container-tight py-4">
  <div class="text-center mb-4">
    <h1 class="h3">Админ панель</h1>
    <p class="text-muted">Введите логин и пароль</p>
  </div>
  <form class="card card-md" action="{{ url_for('admin:login') }}" method="POST" autocomplete="off">
    <div class="card-body">
      <div class="mb-3">
        <label class="form-label">Логин</label>
        <input type="text" name="username" class="form-control" placeholder="Логин" autocomplete="username" />
      </div>
      <div class="mb-2">
        <label class="form-label">Пароль</label>
        <input type="password" name="password" class="form-control" placeholder="Пароль" autocomplete="current-password" />
      </div>
      {% if error %}
      <div class="text-danger mt-3">{{ error }}</div>
      {% endif %}
      <div class="form-footer mt-4">
        <button type="submit" class="btn btn-primary w-100">Войти</button>
      </div>
    </div>
  </form>
</div>
{% endblock %}
